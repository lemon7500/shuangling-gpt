<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霜铃 GPT · 桌宠设置</title>
<style>
:root{color-scheme:light;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:#383143;background:#f6f3fa}*{box-sizing:border-box}body{margin:0;padding:44px 22px}main{max-width:720px;margin:auto}h1{margin:0;font-size:30px;letter-spacing:1px}p{color:#766d80}header{margin-bottom:24px}.card{background:#fff;border:1px solid #e6deec;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 8px 30px #51406608}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.status{display:inline-block;border-radius:40px;padding:5px 13px;background:#ece4f6;color:#635075;font-weight:600}label{display:block;margin:14px 0 6px;font-weight:600}select,input,button{font:inherit;border-radius:10px}select,input{padding:10px 12px;border:1px solid #d9cfe2;background:#fff;color:#383143}select{max-width:100%;width:100%}input{width:140px}button{border:0;padding:10px 17px;background:#78618e;color:white;cursor:pointer}button:hover{background:#654d7b}button.secondary{background:#eee8f3;color:#5d4c6c}button:disabled{opacity:.5;cursor:wait}small{color:#83798c}code{font:12px Consolas,monospace;word-break:break-all}#notice{min-height:26px;color:#665177}#issue{color:#a15e54}.subtle{font-size:13px}.position{display:grid;grid-template-columns:1fr 1fr;gap:12px}.position input{width:100%}footer{color:#968c9f;text-align:center;font-size:12px;margin-top:28px}@media(max-width:500px){body{padding:24px 14px}.card{padding:18px}.position{grid-template-columns:1fr}}
</style>
<style>[hidden]{display:none!important}.usage-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.usage-item{background:#f7f4fa;border-radius:12px;padding:16px}.usage-item:first-child{grid-column:1/-1}.usage-grid.single-window{grid-template-columns:1fr}.usage-number{font-size:21px;font-weight:600;color:#665078}.usage-item p{margin:5px 0}.usage-item progress{display:block;width:100%;height:10px;accent-color:#8a709e;margin:12px 0}.usage-time{font-size:12px;color:#86768e}@media(max-width:500px){.usage-grid{grid-template-columns:1fr}}</style>
<main>
<header><h1>霜铃 GPT</h1><p>和当前的任务一起思考，也安静地陪着你。</p></header>
<section class="card"><div class="row"><span class="status" id="status">连接中</span><span id="control"></span></div><p class="subtle" id="issue" hidden></p><small>联动范围</small><div><strong id="bound">整个 Codex</strong></div><p id="globalCounts" class="subtle">读取整体任务状态…</p><p class="subtle">用量区的聊天选择只用于查看该聊天的上下文和累计 token。</p><button class="secondary" id="pause">暂停联动</button></section>
<section class="card" id="usage"><div class="row"><strong>用量与上下文</strong><button id="refreshUsage" class="secondary">刷新用量</button></div><p class="subtle" id="usageSource">用量来源未知</p><select id="usageThread" aria-label="查看哪个聊天的用量" hidden></select><div class="usage-grid" id="usageGrid"><div class="usage-item"><strong id="contextLabel">上下文剩余</strong><p class="usage-number" id="contextValue">未知</p><progress id="contextBar" max="100" hidden></progress><p class="usage-time" id="contextTime">等待本机采样</p><div class="row"><strong id="projectLabel">本聊天已用</strong><span class="usage-number" id="projectValue">未知</span></div><p class="usage-time" id="projectTime">等待识别用量来源</p></div><div class="usage-item" id="fiveHourCard"><strong>账户 5 小时额度</strong><p class="usage-number" id="fiveHourValue">未知</p><progress id="fiveHourBar" max="100" hidden></progress><p class="usage-time" id="fiveHourTime">等待本机采样</p></div><div class="usage-item" id="weeklyCard"><strong>账户每周额度</strong><p class="usage-number" id="weeklyValue">未知</p><progress id="weeklyBar" max="100" hidden></progress><p class="usage-time" id="weeklyTime">等待本机采样</p></div></div></section>
<section class="card"><strong>桌面上的样子</strong><p class="subtle">拖动霜铃可以直接移动。这里保存大小和启动位置。</p><label for="height">显示高度（约，像素）</label><input id="height" type="number" min="57" max="427" step="1" value="200"><label for="corner">停靠位置</label><select id="corner"><option value="bottom-right">右下角</option><option value="bottom-left">左下角</option><option value="top-right">右上角</option><option value="top-left">左上角</option></select><div class="position"><div><label for="marginX">水平边距</label><input id="marginX" type="number" min="0" max="3000" value="24"></div><div><label for="marginY">垂直边距</label><input id="marginY" type="number" min="0" max="3000" value="24"></div></div><p class="subtle">保存会由桌宠自身重新应用窗口设置；已隐藏的霜铃仍保持隐藏。</p><button id="appearance">保存大小和位置</button></section>
<div id="notice" role="status" aria-live="polite"></div><button id="shutdown" class="secondary">完全退出 Windows 桌宠</button><footer>本机只读联动 · 不保存对话正文 · 无需 API Key</footer>
</main>
<script>
const token=location.hash.slice(1);let current;let appearanceMetrics={visibleHeightRatio:(158*300/208)/640,minWidth:160,maxWidth:1200};const $=id=>document.getElementById(id);const labels={idle:'陪伴中',working:'正在思考',waiting:'等你回答',complete:'本轮完成',interrupted:'已中断',unknown:'状态未知'};const issues={'log-not-found':'暂时找不到这段聊天的日志。','log-permission-denied':'日志暂时不可读，陪伴和拖动仍可使用。','log-unavailable':'日志暂时不可读，陪伴和拖动仍可使用。','runtime-unavailable':'桌宠进程暂未就绪。','runtime-unreachable':'暂时无法连接桌宠进程。','pet-not-displayed':'桌宠已隐藏，联动不会自动重新打开。','lock-lost':'你已接管桌宠动作。','preempted':'你已接管桌宠动作。','locked':'桌宠正由其他操作控制。'};
issues['interaction-active']='你正在操作霜铃，确认交互结束后会继续联动。';issues['surface-not-ready']='大小和位置已应用，暂未确认桌宠就绪；可以稍后恢复联动。';function usageTime(sample,context=false){const sampled=sample.observedAt?new Date(sample.observedAt).toLocaleString():'尚无采样';if(context&&sample.status==='historical'&&sample.sample==='last-model-request')return '历史采样 · '+sampled;if(sample.status==='stale')return (sample.reason==='reset-passed'?'重置时间已到，等待新采样':'采样已过期')+' · '+sampled;if(sample.status!=='available')return '暂未提供可靠数据 · '+sampled;return '采样 '+sampled+(sample.resetsAt?' · 重置 '+new Date(sample.resetsAt*1000).toLocaleString():'')}
function usageSample(id,sample,context=false){const historical=context&&sample?.status==='historical'&&sample.sample==='last-model-request';const available=(sample?.status==='available'||historical)&&Number.isFinite(sample.remainingPercent)&&sample.remainingPercent>=0&&sample.remainingPercent<=100&&(!context||Number.isSafeInteger(sample.remainingTokens)&&Number.isSafeInteger(sample.windowTokens)&&sample.remainingTokens>=0&&sample.windowTokens>0&&sample.remainingTokens<=sample.windowTokens);if(context)$('contextLabel').textContent=available&&historical?'上次请求上下文剩余':'上下文剩余';$(id+'Value').textContent=available?(context?'剩余 '+sample.remainingTokens.toLocaleString()+' / '+sample.windowTokens.toLocaleString()+' tokens（'+(Math.round(sample.remainingPercent*10)/10)+'%）':'剩余 '+(Math.round(sample.remainingPercent*10)/10)+'%'):'未知'+(sample?.status==='stale'?'（已过期）':'');$(id+'Bar').hidden=!available;if(available)$(id+'Bar').value=sample.remainingPercent;$(id+'Time').textContent=usageTime(sample||{},context)}
function usageProject(sample,selected){const scope=sample?.scope==='project'?'project':'thread',available=selected&&['available','partial'].includes(sample?.status)&&Number.isSafeInteger(sample.usedTokens)&&sample.usedTokens>=0&&Number.isFinite(Date.parse(sample.observedAt));$('projectLabel').textContent=scope==='thread'?'本聊天已用':'本项目已用';$('projectValue').textContent=available?(sample.status==='partial'?'≥ ':'')+sample.usedTokens.toLocaleString()+' tokens':'未知';$('projectTime').textContent=available?(sample.status==='partial'?'部分记录 · ':'')+'采样 '+new Date(sample.observedAt).toLocaleString():selected?'等待可靠记录':'等待识别用量来源'}
let usageOptions=[],usageRawChoices=[],usageOptionKey='',usageViewRevision=0,usageViewPending=false;
function usageName(value,max=200){return typeof value==='string'?value.replace(/[\s\u0000-\u001f\u007f-\u009f]+/gu,' ').trim().slice(0,max):''}
function usageChoiceOptions(selection){const seen=new Set(),counts=new Map(),choices=Array.isArray(selection?.choices)?selection.choices.filter(c=>{if(typeof c?.threadId!=='string'||!/^[A-Za-z0-9_-]{1,120}$/.test(c.threadId)||seen.has(c.threadId))return false;seen.add(c.threadId);return true}).slice(0,200).map(c=>({threadId:c.threadId,threadName:usageName(c.threadName),projectName:usageName(c.projectName,100)||'未归入项目'})):[];for(const c of choices){c.base=(c.threadName||'未命名聊天')+' · '+c.projectName;counts.set(c.base,(counts.get(c.base)||0)+1)}return choices.map(c=>({threadId:c.threadId,label:c.base+(!c.threadName||counts.get(c.base)>1?' · '+c.threadId.slice(0,8)+(c.threadId.length>12?'…'+c.threadId.slice(-4):c.threadId.slice(8)):''),title:[c.threadName||'未命名聊天',c.projectName,c.threadId].join('\n')}))}
function usageSelection(selection,selected){if(!selected&&!usageChoiceOptions(selection).length&&usageRawChoices.length)selection={...selection,choices:usageRawChoices};const caption=selection?.source==='bound-chat'?'默认聊天':selection?.source==='selected-chat'?'所选聊天':selection?.source==='active-page'?'当前页面':'用量来源';usageOptions=usageChoiceOptions(selection);if(usageOptions.length)usageRawChoices=selection.choices.filter(c=>usageOptions.some(option=>option.threadId===c.threadId)).slice(0,200).map(c=>({threadId:c.threadId,threadName:usageName(c.threadName),projectName:usageName(c.projectName,100)}));const selectedChoice=selected?usageOptions.find(c=>c.threadId===selection.threadId)||usageChoiceOptions({choices:[selection]})[0]:null;$('usageSource').textContent=selected?caption+' · '+selectedChoice.label:'用量来源未知';$('usageSource').title=selected?[usageName(selection.threadName)||'未命名聊天',usageName(selection.projectName,100)||'未归入项目',selection.projectRoot,selection.threadId].filter(Boolean).join('\n'):'';$('usageThread').hidden=!usageOptions.length;$('usageThread').title=$('usageSource').title;const key=JSON.stringify(usageOptions);if(document.activeElement!==$('usageThread')&&key!==usageOptionKey){usageOptionKey=key;const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='选择用量聊天';placeholder.disabled=true;$('usageThread').replaceChildren(placeholder,...usageOptions.map(c=>{const o=document.createElement('option');o.value=c.threadId;o.textContent=c.label;o.title=c.title;return o}))}if(document.activeElement!==$('usageThread'))$('usageThread').value=selected?selection.threadId:''}
async function usage(){if(usageViewPending)return;const revision=usageViewRevision;try{const v=await api('usage');if(revision!==usageViewRevision||usageViewPending)return;const selected=v.selection?.status==='available'&&typeof v.selection.threadId==='string'&&/^[A-Za-z0-9_-]{1,120}$/.test(v.selection.threadId);usageSelection(v.selection,selected);usageSample('context',selected?v.context:null,true);usageProject(v.project,selected)}catch{if(revision!==usageViewRevision||usageViewPending)return;usageSelection({choices:usageRawChoices},false);usageProject(null,false);$('contextValue').textContent='未知（连接已断开）';$('contextBar').hidden=true;$('contextTime').textContent='等待恢复本机连接'}}
let accountPending=false;
async function accountUsage(){if(accountPending)return;accountPending=true;try{const account=await api('account-usage');for(const id of ['fiveHour','weekly']){$(id+'Card').hidden=account?.[id]?.status==='not-applicable';usageSample(id,account?.[id])}$('usageGrid').classList.toggle('single-window',$('fiveHourCard').hidden||$('weeklyCard').hidden)}catch{for(const id of ['fiveHour','weekly']){$(id+'Value').textContent='未知（连接已断开）';$(id+'Bar').hidden=true;$(id+'Time').textContent='等待恢复本机连接'}}finally{accountPending=false}}
$('refreshUsage').onclick=()=>Promise.all([usage(),accountUsage()]);$('usageThread').onchange=async()=>{const threadId=$('usageThread').value;if(usageViewPending||!usageOptions.some(c=>c.threadId===threadId))return;usageViewPending=true;usageViewRevision++;$('usageThread').disabled=true;usageSample('context',null,true);usageProject(null,false);try{await api('usage-target',{threadId})}catch(e){message(e)}finally{usageViewPending=false;$('usageThread').disabled=false;await usage()}};
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'x-shuangling-token':token,...(data===undefined?{}:{'content-type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'operation-unavailable');return v}
function notice(text){$('notice').textContent=text}function message(e){notice(issues[e.message]||'操作暂时不可用，请稍后重试。')}
async function refresh(){try{current=await api('state');const status=current.status;const count=key=>Number.isSafeInteger(status[key])&&status[key]>=0?status[key]:null;$('status').textContent=labels[status.state]||'状态未知';$('bound').textContent='整个 Codex';$('bound').title=status.threadId||'';$('globalCounts').textContent=status.scope==='codex'&&count('workingCount')!==null&&count('waitingCount')!==null?'运行 '+count('workingCount')+' · 等待 '+count('waitingCount')+(count('unknownCount')>0?' · 未知 '+count('unknownCount'):''):'等待整体状态采样';$('control').textContent=current.control.paused?'联动已暂停':current.control.preempted?'用户操作优先':'';$('pause').textContent=current.control.paused||current.control.preempted?'恢复联动':'暂停联动';const reason=current.control.issue||status.reason;$('issue').textContent=issues[reason]||(status.state==='unknown'?'暂时无法确认任务状态，陪伴和拖动仍可使用。':'');$('issue').hidden=!$('issue').textContent}catch(e){$('status').textContent='连接已断开';$('globalCounts').textContent='整体任务状态未知'}}
async function appearance(){try{const v=await api('appearance');if(v.metrics)appearanceMetrics=v.metrics;$('height').min=Math.round(appearanceMetrics.minWidth*appearanceMetrics.visibleHeightRatio);$('height').max=Math.round(appearanceMetrics.maxWidth*appearanceMetrics.visibleHeightRatio);$('height').value=Math.round(v.size*appearanceMetrics.visibleHeightRatio);$('corner').value=v.position.corner;$('marginX').value=v.position.marginX;$('marginY').value=v.position.marginY}catch(e){message(e)}}
$('pause').onclick=async()=>{try{await api('settings',{paused:!(current.control.paused||current.control.preempted)});await refresh()}catch(e){message(e)}};
$('appearance').onclick=async()=>{try{await api('appearance',{size:Math.min(appearanceMetrics.maxWidth,Math.max(appearanceMetrics.minWidth,Math.round(Number($('height').value)/appearanceMetrics.visibleHeightRatio))),corner:$('corner').value,marginX:Number($('marginX').value),marginY:Number($('marginY').value)});notice('已保存大小和位置。')}catch(e){message(e)}};
$('shutdown').onclick=async()=>{try{await api('shutdown',{});notice('已退出，可以关闭这个页面。')}catch(e){message(e)}};
async function init(){await refresh();await Promise.all([appearance(),usage(),accountUsage()]);if(new URLSearchParams(location.search).get('view')==='usage')$('usage').scrollIntoView();setInterval(refresh,1200);setInterval(usage,5000);setInterval(accountUsage,5000)}init();
</script>
</html>
