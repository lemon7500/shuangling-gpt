<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>霜铃 GPT · 控制面板</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel-ui.js" defer></script>
</head>
<body>
  <main class="panel" aria-label="霜铃 GPT 控制面板">
    <header class="header">
      <span class="avatar"><img src="panel-avatar.png" width="40" height="40" alt=""></span>
      <div class="identity"><h1>霜铃 GPT <span class="version">1.8.1</span></h1><p><span id="status-dot" class="status-dot"></span><span id="header-state">正在连接…</span></p></div>
      <button id="close" class="icon-button" type="button" aria-label="关闭面板" title="关闭面板 · Esc"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    </header>
    <nav class="tabs" role="tablist" aria-label="控制页面">
      <button id="tab-overview" role="tab" aria-selected="true" aria-controls="overview" tabindex="0" data-tab="overview" type="button">总览</button>
      <button id="tab-actions" role="tab" aria-selected="false" aria-controls="actions" tabindex="-1" data-tab="actions" type="button">动作</button>
      <button id="tab-settings" role="tab" aria-selected="false" aria-controls="settings" tabindex="-1" data-tab="settings" type="button">设置</button>
    </nav>
    <div class="scroll-area">
      <section id="overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
        <div class="task-card">
          <div class="section-heading"><span>此刻的霜铃</span><span id="control-badge" class="badge">连接中</span></div>
          <div class="task-line"><strong id="task-state">正在读取任务状态</strong><button id="pause" class="small-button" type="button" disabled>暂停联动</button></div>
          <p class="chat-line"><span id="scope-label">联动范围</span><span id="thread">整个 Codex</span><span id="codex-counts" hidden></span></p>
          <p id="state-hint" class="state-hint" hidden></p>
        </div>
        <div class="section-heading usage-heading"><h2>用量与上下文</h2><span class="quiet">最近本机采样</span></div>
        <div class="usage-source"><label id="usage-source-caption" for="usage-thread">用量来源</label><strong id="usage-source" data-state="unknown">用量来源未知</strong><div id="usage-picker" class="usage-picker" hidden><button id="usage-thread" type="button" role="combobox" aria-label="查看哪个聊天的用量" aria-expanded="false" aria-controls="usage-options" aria-haspopup="listbox"><span id="usage-current">选择用量聊天</span><span aria-hidden="true">⌄</span></button><div id="usage-options" class="usage-options" role="listbox" aria-label="聊天用量列表" hidden></div></div></div>
        <div class="usage-card context-card">
          <div class="usage-label"><span id="context-label">上下文剩余</span><span id="context-percent" class="percent">—</span></div>
          <div id="context-value" class="context-value">未知</div>
          <progress id="context-bar" max="100" value="0" hidden aria-label="上下文剩余比例"></progress>
          <p id="context-time" class="sample-time">等待可靠采样</p>
          <div class="project-total"><span id="project-label">本聊天已用</span><span><strong id="project-value">未知</strong><small id="project-suffix"></small></span></div>
          <p id="project-time" class="sample-time project-time">等待识别用量来源</p>
        </div>
        <div class="quota-grid" id="quota-grid">
          <div class="usage-card" id="fiveHour-card"><div class="usage-label">账户 5 小时剩余</div><strong id="fiveHour-value" class="quota-value">未知</strong><progress id="fiveHour-bar" max="100" value="0" hidden aria-label="账户 5 小时额度剩余比例"></progress><p id="fiveHour-time" class="sample-time">等待采样</p></div>
          <div class="usage-card" id="weekly-card"><div class="usage-label">账户每周剩余</div><strong id="weekly-value" class="quota-value">未知</strong><progress id="weekly-bar" max="100" value="0" hidden aria-label="账户每周额度剩余比例"></progress><p id="weekly-time" class="sample-time">等待采样</p></div>
        </div>
      </section>
      <section id="actions" role="tabpanel" aria-labelledby="tab-actions" tabindex="0" hidden>
        <div class="section-heading"><h2>和霜铃互动</h2><span class="quiet">9 个动作</span></div>
        <p class="intro">选一个动作，看看她的回应。</p>
        <div class="action-grid">
          <button type="button" data-animation="idle"><span class="action-icon" aria-hidden="true">☾</span><span>安静陪伴</span></button>
          <button type="button" data-animation="running"><span class="action-icon" aria-hidden="true">✧</span><span>认真思考</span></button>
          <button type="button" data-animation="review"><span class="action-icon" aria-hidden="true">✓</span><span>检查工作</span></button>
          <button type="button" data-animation="waiting"><span class="action-icon" aria-hidden="true">…</span><span>等你回答</span></button>
          <button type="button" data-animation="waving"><span class="action-icon" aria-hidden="true">♧</span><span>开心挥手</span></button>
          <button type="button" data-animation="jumping"><span class="action-icon" aria-hidden="true">↟</span><span>轻轻小跳</span></button>
          <button type="button" data-animation="running-left"><span class="action-icon" aria-hidden="true">←</span><span>向左小跑</span></button>
          <button type="button" data-animation="failed"><span class="action-icon" aria-hidden="true">⌄</span><span>收起动作</span></button>
          <button type="button" data-animation="running-right"><span class="action-icon" aria-hidden="true">→</span><span>向右小跑</span></button>
        </div>
        <div class="interaction-note"><span class="note-mark" aria-hidden="true">i</span><p>点播后由你接管动作。回到「总览」点「恢复联动」，即可继续跟随 Codex。</p></div>
      </section>
      <section id="settings" role="tabpanel" aria-labelledby="tab-settings" tabindex="0" hidden>
        <div class="section-heading"><h2>桌面上的样子</h2><span class="quiet">实时保存</span></div>
        <div class="settings-card">
          <div class="setting-label"><label for="height-range">可见高度</label><div class="height-number"><input id="height-number" type="number" inputmode="numeric" min="57" max="425" step="1" disabled aria-label="可见高度（像素）"><span>px</span></div></div>
          <input id="height-range" type="range" min="57" max="425" step="1" disabled aria-label="可见高度滑块">
          <div class="range-labels"><span id="height-min">57 px</span><span id="height-max">425 px</span></div>
          <div class="setting-row"><label for="corner">停靠位置</label><select id="corner" disabled><option value="bottom-right">右下角</option><option value="bottom-left">左下角</option><option value="top-right">右上角</option><option value="top-left">左上角</option></select></div>
        </div>
        <div class="settings-card launch-card">
          <div class="setting-row"><label for="auto-launch">随 Codex 自动启动</label><button id="auto-launch" class="switch" role="switch" aria-checked="false" type="button" disabled><span></span></button></div>
          <p id="launch-hint" class="setting-description">读取自动联动状态…</p>
        </div>
        <button id="advanced" class="advanced" type="button"><span>高级设置</span><span aria-hidden="true">↗</span></button>
        <p class="footnote">拖动霜铃可以直接移动位置。</p>
      </section>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <footer class="footer">
      <button id="home" class="footer-home" type="button" title="回到初始位置" aria-label="回到初始位置"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3 9 7-6 7 6M5 8v9h10V8M8 17v-5h4v5"/></svg></button>
      <button id="hide" type="button">隐藏霜铃</button>
      <button id="quit" class="quit" type="button">退出霜铃</button>
    </footer>
  </main>
</body>
</html>
